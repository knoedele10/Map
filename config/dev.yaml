# Run from backend/ (start.ps1 does this automatically).
server:
  addr: "127.0.0.1:8090"
  mode: "release"
  serve_web: true
  auth_token: ""
  rate_limit_per_min: 0
  request_timeout_s: 240
  cors_origins: ["http://127.0.0.1:8090", "http://localhost:8090"]
  openapi_file: "openapi.yaml"
storage:
  backend: "file"
  data_dir: "../data/runtime/data"
  docs_dir: "../data/corpus"
  assets_dir: "../data/runtime/data/assets"
  web_dir: "../frontend"
  sites_file: "../archive/houduan-delivery/sites.json"
embedding:
  provider: "ollama"
  base_url: "http://127.0.0.1:11434"
  model: "bge-m3:latest"
  dim: 1024
  normalize: true
  batch_size: 8
  timeout_s: 120
chat:
  provider: "ollama"
  base_url: "http://127.0.0.1:11434"
  model: "qwen2.5:7b"
  vision_model: "qwen2.5vl-16k:latest"
  temperature: 0.1
  max_tokens: 1536
  timeout_s: 240
vision:
  enabled: true
  provider: "ollama"
  base_url: "http://127.0.0.1:11434"
  model: "qwen2.5vl-16k:latest"
  timeout_s: 180
  max_image_mb: 8
  max_images_per_doc: 50
recognize:
  retrieval_url: ""
ingest:
  workers: 1
  max_file_mb: 32
  auto_ingest_upload: true
log:
  level: "info"
